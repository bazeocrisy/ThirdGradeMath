<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Times Table Practice</title>
<style>
  :root{
    --theme:#3A86FF;
    --theme-soft:#E3EDFF;
    --on-theme:#FFFFFF;
    --paper:#FFFDF7;
    --ink:#22243B;
    --ink-soft:#6A6E90;
    --line:#DCDCEC;
    --right:#12A150;
    --right-bg:#E3F8EC;
    --wrong:#E5484D;
    --wrong-bg:#FDEAEA;
    --display:"Trebuchet MS","Segoe UI",Verdana,sans-serif;
    --ui:Verdana,Geneva,"DejaVu Sans",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 12% 8%, #FFE8A3 0 12px, transparent 13px),
      radial-gradient(circle at 88% 14%, #B9E8FF 0 14px, transparent 15px),
      radial-gradient(circle at 8% 82%, #D8F5C6 0 16px, transparent 17px),
      radial-gradient(circle at 92% 76%, #FFD1E3 0 12px, transparent 13px);
    background-repeat:no-repeat;
    color:var(--ink);
    font-family:var(--ui);
    min-height:100vh;
    display:flex;justify-content:center;
    padding:18px 14px 36px;
  }
  .shell{width:100%;max-width:640px}
  .card{
    background:#fff;
    border:3px solid var(--ink);
    border-radius:22px;
    box-shadow:0 8px 0 rgba(34,36,59,.16);
    padding:20px 20px 24px;
    overflow:hidden;
  }
  .banner{
    background:var(--theme);color:var(--on-theme);
    margin:-20px -20px 18px;padding:18px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .banner h1,.banner h2{font-family:var(--display);margin:0;font-size:27px;letter-spacing:.01em}
  .banner .badge{
    background:rgba(255,255,255,.25);border-radius:999px;
    padding:6px 14px;font-size:14px;font-weight:bold;white-space:nowrap;
  }
  h1,h2{font-family:var(--display)}
  p{line-height:1.55;margin:0 0 12px}
  .sub{color:var(--ink-soft);font-size:14px}
  label{display:block;font-size:12px;font-weight:bold;letter-spacing:.08em;
        text-transform:uppercase;color:var(--ink-soft);margin:18px 0 9px}
  input[type=text]{
    width:100%;font-family:var(--ui);font-size:17px;padding:12px;
    border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);
  }
  input[type=text]:focus{outline:none;border-color:var(--theme)}
  .choices{display:flex;flex-wrap:wrap;gap:9px}
  .chip{
    font-family:var(--display);font-size:19px;font-weight:bold;
    min-width:56px;padding:12px 10px;cursor:pointer;color:#fff;
    border:3px solid var(--ink);border-radius:16px;
    box-shadow:0 4px 0 rgba(34,36,59,.25);
    transition:transform .08s ease;
  }
  .chip.wide{min-width:auto;padding:12px 16px;font-size:16px}
  .chip[aria-pressed=false]{opacity:.55}
  .chip[aria-pressed=true]{transform:translateY(-2px)}
  .chip:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(34,36,59,.25)}
  .chip:focus-visible,button:focus-visible,input:focus-visible{outline:4px solid #22243B;outline-offset:3px}
  .btn{
    font-family:var(--display);font-size:19px;font-weight:bold;cursor:pointer;
    padding:14px 22px;border-radius:16px;border:3px solid var(--ink);
    background:var(--theme);color:var(--on-theme);
    box-shadow:0 5px 0 rgba(34,36,59,.3);
  }
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(34,36,59,.3)}
  .btn.quiet{background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(34,36,59,.15)}
  .btn.block{width:100%;margin-top:24px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .bar{display:flex;justify-content:space-between;align-items:center;
       font-size:14px;font-weight:bold;color:var(--ink-soft);margin-bottom:10px;gap:10px}
  .track{height:14px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:20px}
  .fill{height:100%;width:0;background:var(--theme);border-radius:999px;transition:width .3s ease}
  .problem{display:flex;justify-content:center;position:relative}
  .stack{min-width:200px;text-align:right;font-family:var(--display);font-weight:bold;
         font-size:60px;line-height:1.16;font-variant-numeric:tabular-nums;padding-right:10px}
  .stack .sign{float:left;padding-left:16px;color:var(--theme)}
  .ruleline{border-bottom:6px solid var(--ink);padding-bottom:2px}
  .answer{
    margin-top:12px;width:100%;text-align:right;font-family:var(--display);
    font-size:56px;font-weight:bold;padding:2px 10px 8px 0;
    border:none;border-bottom:6px dashed var(--line);background:transparent;color:var(--theme);
  }
  .answer:focus{outline:none;border-bottom-color:var(--theme)}
  .answer.ok{color:var(--right);border-bottom-color:var(--right)}
  .answer.no{color:var(--wrong);border-bottom-color:var(--wrong)}
  .pop{animation:pop .35s ease}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
  .shake{animation:shake .3s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .verdict{min-height:36px;text-align:center;font-family:var(--display);
           font-weight:bold;font-size:20px;margin:14px 0 2px}
  .verdict.ok{color:var(--right)}
  .verdict.no{color:var(--wrong)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
  .key{font-family:var(--display);font-size:24px;font-weight:bold;padding:15px 0;cursor:pointer;
       background:#fff;border:3px solid var(--ink);border-radius:16px;color:var(--ink);
       box-shadow:0 4px 0 rgba(34,36,59,.18)}
  .key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(34,36,59,.18)}
  .key.go{background:var(--theme);color:var(--on-theme);font-size:19px}
  .hint{background:var(--theme-soft);border:3px dashed var(--theme);border-radius:18px;padding:16px 18px}
  .hint b{display:block;font-family:var(--display);font-size:21px;margin-bottom:6px}
  .stars{font-size:46px;letter-spacing:6px;color:#FFC300;text-align:center;margin:4px 0 6px}
  .stars .off{color:var(--line)}
  .score{font-family:var(--display);font-size:52px;font-weight:bold;text-align:center;margin:0 0 4px}
  .center{text-align:center}
  .misslist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:9px}
  .misslist li{background:var(--wrong-bg);border:3px solid var(--wrong);color:var(--wrong);
               border-radius:14px;padding:8px 12px;font-family:var(--display);font-weight:bold;font-size:18px}
  .foot{margin-top:16px;font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.6}
  .toggle{background:none;border:none;cursor:pointer;font-size:13px;font-weight:bold;
          color:var(--on-theme);font-family:var(--ui)}
  .confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:9}
  .bit{position:absolute;width:11px;height:16px;border-radius:3px;animation:fall 1s ease-out forwards}
  @keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}
                  100%{transform:translateY(150px) rotate(320deg);opacity:0}}
  .hidden{display:none}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
  @media (max-width:420px){
    .stack{font-size:50px;min-width:160px}
    .answer{font-size:46px}
    .banner h1,.banner h2{font-size:22px}
  }
</style>
</head>
<body>
<div class="confetti" id="confetti"></div>
<div class="shell">

  <!-- START -->
  <section id="start" class="card">
    <div class="banner">
      <h1>Times Table Practice</h1>
      <span class="badge">Grade 3</span>
    </div>
    <p class="sub">Pick a number. Learn the rule. Practice until it's easy.</p>

    <label for="name">Your name (optional)</label>
    <input type="text" id="name" placeholder="First name" autocomplete="off">

    <label>Practice the</label>
    <div class="choices" id="tables"></div>

    <label>How many problems?</label>
    <div class="choices" id="lengths"></div>

    <button class="btn block" id="go">Start practice</button>
    <p class="foot">Nothing is saved or sent anywhere. Close the tab and it's gone.</p>
  </section>

  <!-- RULE -->
  <section id="ruleScreen" class="card hidden">
    <div class="banner">
      <h2 id="ruleTitle">The rule</h2>
      <button class="toggle" id="soundBtn" aria-pressed="false">Sound: off</button>
    </div>
    <div class="hint"><b id="ruleHead"></b><span id="ruleBody"></span></div>
    <p class="sub" id="ruleExample" style="margin-top:16px"></p>
    <button class="btn block" id="ruleGo">Got it &mdash; start</button>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="card hidden">
    <div class="banner">
      <h2 id="quizTitle">The 1s</h2>
      <span class="badge" id="streak">Streak: 0</span>
    </div>
    <div class="bar">
      <span id="counter">Problem 1 of 10</span>
      <span id="hintPeek" style="cursor:pointer;text-decoration:underline">Show the rule</span>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div id="peek" class="hint hidden" style="margin-bottom:18px"><b id="peekHead"></b><span id="peekBody"></span></div>

    <div class="problem">
      <div class="stack" id="stack">
        <div id="top">7</div>
        <div class="ruleline"><span class="sign">&times;</span><span id="bottom">1</span></div>
        <input class="answer" id="answer" inputmode="numeric" autocomplete="off"
               aria-label="Your answer" placeholder="?">
      </div>
    </div>

    <div class="verdict" id="verdict"></div>

    <div class="pad" id="pad">
      <button class="key">1</button><button class="key">2</button><button class="key">3</button>
      <button class="key">4</button><button class="key">5</button><button class="key">6</button>
      <button class="key">7</button><button class="key">8</button><button class="key">9</button>
      <button class="key" data-act="del">&larr;</button>
      <button class="key">0</button>
      <button class="key go" data-act="enter" id="enterKey">Check</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="done" class="card hidden">
    <div class="banner"><h2 id="doneTitle">Nice work!</h2></div>
    <div class="stars" id="stars">&#9733;&#9733;&#9733;</div>
    <div class="score" id="finalScore">10 / 10</div>
    <p class="sub center" id="doneDetail"></p>
    <div id="missWrap" class="hidden">
      <label>Facts to practice again</label>
      <ul class="misslist" id="missList"></ul>
    </div>
    <div class="row" style="margin-top:24px">
      <button class="btn" id="againMissed">Practice the misses</button>
      <button class="btn quiet" id="againSame">Same set again</button>
      <button class="btn quiet" id="restart">Pick a new number</button>
    </div>
  </section>

  <p class="foot">Works offline &middot; no accounts &middot; no data collected</p>
</div>

<script>
(function(){
  "use strict";

  var COLORS = {
    0:"#EF476F", 1:"#F77F00", 2:"#FFC300", 3:"#8AC926", 4:"#12A150",
    5:"#06AED5", 6:"#3A86FF", 7:"#7B4BFF", 8:"#B5179E", 9:"#E0479E",
    10:"#00A6A6", 11:"#E4572E", 12:"#5E60CE",
    mix01:"#FF6B35", mixall:"#6247AA"
  };
  var DARK_TEXT = {2:true, 3:true};

  var RULES = {
    0:{head:"Any number \u00D7 0 = 0",
       body:"Multiplying by 0 means there is nothing to count. It does not matter how big the other number is \u2014 the answer is always 0.",
       ex:"Example: 6 \u00D7 0 = 0, and 0 \u00D7 45 = 0."},
    1:{head:"Any number \u00D7 1 = that same number",
       body:"One group of a number is just that number. Whatever goes in comes right back out \u2014 copy it down.",
       ex:"Example: 8 \u00D7 1 = 8, and 1 \u00D7 52 = 52."},
    2:{head:"Multiplying by 2 means doubling",
       body:"Add the number to itself. If you can add it twice, you already know the answer.",
       ex:"Example: 7 \u00D7 2 is 7 + 7 = 14."},
    3:{head:"Double it, then add one more group",
       body:"Three groups is two groups plus one. Double the number, then add the number again.",
       ex:"Example: 6 \u00D7 3 is 12 + 6 = 18."},
    4:{head:"Double it, then double it again",
       body:"Four is two twos. Double the number once, then double your answer.",
       ex:"Example: 7 \u00D7 4 is 14, doubled = 28."},
    5:{head:"Count by fives \u2014 answers end in 5 or 0",
       body:"Every answer in the fives ends in 5 or 0. Or take ten groups and cut it in half.",
       ex:"Example: 8 \u00D7 5 is half of 80 = 40."},
    6:{head:"Five groups, plus one more group",
       body:"Take the fives answer you already know and add the number one more time.",
       ex:"Example: 7 \u00D7 6 is 35 + 7 = 42."},
    7:{head:"Five groups, plus two more groups",
       body:"Take the fives answer and add double the number. The sevens are the hardest set \u2014 go slow.",
       ex:"Example: 6 \u00D7 7 is 30 + 12 = 42."},
    8:{head:"Double, double, double",
       body:"Eight is two, doubled, doubled. Another way: ten groups minus two groups.",
       ex:"Example: 7 \u00D7 8 is 14, then 28, then 56."},
    9:{head:"Ten groups, minus one group",
       body:"Multiply by 10 first, then subtract the number once. The two digits of every answer add up to 9.",
       ex:"Example: 7 \u00D7 9 is 70 \u2212 7 = 63, and 6 + 3 = 9."},
    10:{head:"Multiplying by 10 puts a 0 on the end",
       body:"Every digit moves up one place, so the answer is the number with a zero after it.",
       ex:"Example: 7 \u00D7 10 = 70."},
    11:{head:"Small numbers repeat the digit",
       body:"For 1 through 9, the answer is that digit written twice.",
       ex:"Example: 7 \u00D7 11 = 77."},
    12:{head:"Ten groups, plus two more groups",
       body:"Multiply by 10, then add double the number.",
       ex:"Example: 7 \u00D7 12 is 70 + 14 = 84."},
    mix01:{head:"Two rules at once",
       body:"Any number \u00D7 0 is 0. Any number \u00D7 1 stays the same. Look carefully \u2014 they are mixed together.",
       ex:"Watch out for 0 \u00D7 0 and 1 \u00D7 1."},
    mixall:{head:"Everything mixed together",
       body:"Problems come from all the tables, 0 through 12, in random order.",
       ex:"Take your time on the sevens and eights."}
  };

  var el = function(id){ return document.getElementById(id); };
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var state = {name:"", table:1, length:10, problems:[], idx:0, correct:0,
               streak:0, best:0, misses:[], answered:false, start:0, sound:false};

  function label(t){
    return t === "mix01" ? "0s & 1s" : t === "mixall" ? "All mixed" : "The " + t + "s";
  }
  function theme(t){
    var c = COLORS[t];
    document.documentElement.style.setProperty("--theme", c);
    document.documentElement.style.setProperty("--theme-soft", c + "22");
    document.documentElement.style.setProperty("--on-theme", DARK_TEXT[t] ? "#22243B" : "#FFFFFF");
  }

  /* ---- start screen ---- */
  var tablesBox = el("tables"), opts = [];
  for (var n = 0; n <= 12; n++) opts.push({v:n, label:n + "s"});
  opts.push({v:"mix01", label:"0s & 1s", wide:true});
  opts.push({v:"mixall", label:"All mixed", wide:true});
  opts.forEach(function(o){
    var b = document.createElement("button");
    b.className = "chip" + (o.wide ? " wide" : "");
    b.textContent = o.label;
    b.style.background = COLORS[o.v];
    if (DARK_TEXT[o.v]) b.style.color = "#22243B";
    b.setAttribute("aria-pressed", o.v === 1 ? "true" : "false");
    b.onclick = function(){
      state.table = o.v;
      theme(o.v);
      Array.prototype.forEach.call(tablesBox.children, function(c){ c.setAttribute("aria-pressed","false"); });
      b.setAttribute("aria-pressed","true");
    };
    tablesBox.appendChild(b);
  });

  var lengthsBox = el("lengths");
  [10,20,30,50].forEach(function(v,i){
    var b = document.createElement("button");
    b.className = "chip wide";
    b.textContent = v;
    b.style.background = "#22243B";
    b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
    b.onclick = function(){
      state.length = v;
      Array.prototype.forEach.call(lengthsBox.children, function(c){ c.setAttribute("aria-pressed","false"); });
      b.setAttribute("aria-pressed","true");
    };
    lengthsBox.appendChild(b);
  });

  /* ---- sound ---- */
  var ac = null;
  function beep(freq, dur){
    if (!state.sound) return;
    try{
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(.09, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    }catch(e){}
  }
  el("soundBtn").onclick = function(){
    state.sound = !state.sound;
    this.textContent = "Sound: " + (state.sound ? "on" : "off");
    this.setAttribute("aria-pressed", state.sound ? "true" : "false");
    if (state.sound) beep(880,.12);
  };

  /* ---- confetti ---- */
  function burst(){
    if (reduced) return;
    var box = el("confetti"), pal = ["#EF476F","#FFC300","#8AC926","#06AED5","#7B4BFF","#F77F00"];
    for (var i = 0; i < 16; i++){
      var b = document.createElement("div");
      b.className = "bit";
      b.style.background = pal[i % pal.length];
      b.style.left = (18 + Math.random() * 64) + "%";
      b.style.top = (26 + Math.random() * 22) + "%";
      b.style.animationDelay = (Math.random() * .12) + "s";
      box.appendChild(b);
      (function(node){ setTimeout(function(){ node.remove(); }, 1200); })(b);
    }
  }

  /* ---- problems ---- */
  function shuffle(a){
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function build(){
    var list = [], i, n;
    if (state.table === "mix01"){
      for (i = 0; i <= 12; i++){ list.push([i,0],[0,i],[i,1],[1,i]); }
    } else if (state.table === "mixall"){
      for (n = 0; n <= 12; n++) for (i = 0; i <= 12; i++) list.push([n,i]);
    } else {
      n = state.table;
      for (i = 0; i <= 12; i++){ list.push([n,i],[i,n]); }
    }
    shuffle(list);
    var out = [];
    while (out.length < state.length) out = out.concat(list);
    state.problems = out.slice(0, state.length);
  }

  function show(id){
    ["start","ruleScreen","quiz","done"].forEach(function(s){
      el(s).classList.toggle("hidden", s !== id);
    });
  }

  el("go").onclick = function(){
    state.name = el("name").value.trim();
    theme(state.table);
    build();
    var r = RULES[state.table];
    el("ruleTitle").textContent = state.name ? ("Ready, " + state.name + "?") : label(state.table);
    el("ruleHead").textContent = r.head;
    el("ruleBody").textContent = r.body;
    el("ruleExample").textContent = r.ex;
    el("peekHead").textContent = r.head;
    el("peekBody").textContent = r.body;
    show("ruleScreen");
  };
  el("ruleGo").onclick = function(){ beginRun(); };
  el("hintPeek").onclick = function(){
    var p = el("peek"), hidden = p.classList.toggle("hidden");
    this.textContent = hidden ? "Show the rule" : "Hide the rule";
  };

  function beginRun(){
    state.idx = 0; state.correct = 0; state.streak = 0; state.best = 0;
    state.misses = []; state.start = Date.now();
    el("quizTitle").textContent = label(state.table);
    show("quiz");
    render();
  }

  function render(){
    var p = state.problems[state.idx];
    state.answered = false;
    el("top").textContent = p[0];
    el("bottom").textContent = p[1];
    el("counter").textContent = "Problem " + (state.idx + 1) + " of " + state.problems.length;
    el("streak").textContent = "Streak: " + state.streak;
    el("fill").style.width = (state.idx / state.problems.length * 100) + "%";
    el("verdict").textContent = ""; el("verdict").className = "verdict";
    el("enterKey").textContent = "Check";
    var a = el("answer");
    a.value = ""; a.className = "answer"; a.readOnly = false; a.focus();
  }

  function check(){
    var a = el("answer"), raw = a.value.trim();
    if (raw === ""){ a.focus(); return; }
    var p = state.problems[state.idx], right = p[0] * p[1];
    var ok = Number(raw) === right;
    state.answered = true; a.readOnly = true;

    if (ok){
      state.correct++; state.streak++;
      if (state.streak > state.best) state.best = state.streak;
      a.className = "answer ok pop";
      el("verdict").textContent = state.streak >= 5 ? (state.streak + " in a row!") : "Correct";
      el("verdict").className = "verdict ok";
      beep(880,.14);
      if (state.streak > 0 && state.streak % 5 === 0) burst();
      setTimeout(next, 600);
    } else {
      state.streak = 0;
      state.misses.push(p[0] + "\u00D7" + p[1]);
      a.className = "answer no shake";
      el("verdict").textContent = p[0] + " \u00D7 " + p[1] + " = " + right;
      el("verdict").className = "verdict no";
      el("enterKey").textContent = "Next";
      beep(220,.2);
    }
    el("streak").textContent = "Streak: " + state.streak;
  }

  function next(){
    state.idx++;
    if (state.idx >= state.problems.length) finish();
    else render();
  }

  function finish(){
    var total = state.problems.length;
    var secs = Math.round((Date.now() - state.start) / 1000);
    var mins = Math.floor(secs / 60), rem = secs % 60;
    var timeStr = mins ? (mins + " min " + rem + " sec") : (secs + " sec");
    var pct = Math.round(state.correct / total * 100);
    var stars = pct >= 90 ? 3 : pct >= 70 ? 2 : 1;

    el("doneTitle").textContent = pct === 100 ? "Perfect score!"
      : pct >= 80 ? (state.name ? ("Nice work, " + state.name + "!") : "Nice work!")
      : "Good effort \u2014 keep going";
    el("stars").innerHTML = [0,1,2].map(function(i){
      return i < stars ? "\u2605" : '<span class="off">\u2605</span>';
    }).join("");
    el("finalScore").textContent = state.correct + " / " + total;
    el("doneDetail").textContent = pct + "% correct \u00B7 " + timeStr + " \u00B7 longest streak " + state.best;

    var seen = {}, uniq = [];
    state.misses.forEach(function(m){ if (!seen[m]){ seen[m] = 1; uniq.push(m); } });
    var list = el("missList"); list.innerHTML = "";
    if (uniq.length){
      uniq.forEach(function(m){
        var parts = m.split("\u00D7");
        var li = document.createElement("li");
        li.textContent = parts[0] + " \u00D7 " + parts[1] + " = " + (Number(parts[0]) * Number(parts[1]));
        list.appendChild(li);
      });
      el("missWrap").classList.remove("hidden");
      el("againMissed").classList.remove("hidden");
    } else {
      el("missWrap").classList.add("hidden");
      el("againMissed").classList.add("hidden");
      if (pct === 100) burst();
    }
    show("done");
  }

  el("answer").addEventListener("keydown", function(e){
    if (e.key === "Enter"){ e.preventDefault(); state.answered ? next() : check(); }
  });
  el("pad").addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    var a = el("answer"), act = b.getAttribute("data-act");
    if (act === "enter"){ state.answered ? next() : check(); return; }
    if (state.answered) return;
    if (act === "del") a.value = a.value.slice(0, -1);
    else if (a.value.length < 4) a.value += b.textContent;
    a.focus();
  });

  el("againSame").onclick = function(){ shuffle(state.problems); beginRun(); };
  el("restart").onclick = function(){ show("start"); };
  el("againMissed").onclick = function(){
    var seen = {}, redo = [];
    state.misses.forEach(function(m){
      if (seen[m]) return; seen[m] = 1;
      var p = m.split("\u00D7");
      redo.push([Number(p[0]), Number(p[1])]);
    });
    if (!redo.length) return;
    var target = Math.max(10, redo.length * 2), set = [];
    while (set.length < target) set = set.concat(redo);
    state.problems = shuffle(set.slice(0, target));
    beginRun();
  };

  theme(1);
})();
</script>
</body>
</html>
